# Deploy the hypothesis tool to GitHub Pages.
# The app is fully static (CDN libs, live Socrata API, no build step) — we just
# stage the files the browser needs and upload them.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress production runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # V8 · gate the deploy on the build invariants, the classifier parity check, and the e2e suites.
  # (The source↔data trace is network/flaky, so it runs nightly in trace.yml, not here.)
  test:
    runs-on: ubuntu-latest
    # Run inside Playwright's official image (Chromium + all its system libs pre-installed) so CI never
    # touches apt / the flaky azure.archive.ubuntu.com mirror that was hanging `--with-deps`. Pin the
    # tag to the @playwright/test version in package-lock.json (1.60.0) so the image's pre-baked
    # browsers match the installed client; bump both together when upgrading Playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      # Browsers are baked into the image, so this is a no-op when versions match — kept (without
      # --with-deps) as a cheap self-heal if the client ever drifts ahead of the image tag. No apt.
      - run: npx playwright install chromium
      - name: V1+V3 · build invariants + axis alignment
        run: python3 validation/validate_build.py
      - name: V2 · classifier parity (drug + unhoused)
        run: |
          node validation/parity.mjs drug
          node validation/parity.mjs unhoused
      - name: e2e suites (V5 + V7 included)
        run: |
          npx playwright test -c drug/playwright.config.js
          npx playwright test -c unhoused/playwright.config.js
          npx playwright test -c theft/playwright.config.js

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          # Root landing page — the intervention tracker. It ships its own ES modules (js/app.js +
          # js/tsv.js) and fetches ./data/interventions.tsv, so stage the root js/ and data/ dirs too
          # (not just index.html/styles.css) or the homepage 404s on its script + data.
          mkdir -p _site
          cp index.html styles.css _site/
          mkdir -p _site/js && cp js/*.js _site/js/
          if [ -d data ]; then
            mkdir -p _site/data
            cp -r data/. _site/data/
          fi
          # Shared ES-module lib imported by the dashboards as ../../shared/*.js (data/rollup/
          # classify/chart/transition-map). Staged once at the site root so _site/<project>/js/app.js
          # resolves ../../shared/ to _site/shared/.
          if [ -d shared ]; then
            mkdir -p _site/shared
            cp shared/*.js _site/shared/
          fi
          # Each project lives in its own subdir with an identical static layout:
          #   index.html + styles.css + js/*.js + pre-baked data/ JSON (build/ is
          #   offline Python and is intentionally not shipped). Add a project here
          #   when it gains an index.html. `hypothesis` is the self-serve tool that
          #   used to live at the repo root.
          for project in districts theft unhoused drug okr-map hypothesis; do
            if [ ! -f "$project/index.html" ]; then
              echo "Skipping $project (no index.html yet)"
              continue
            fi
            echo "Staging $project"
            mkdir -p "_site/$project/js"
            cp "$project/index.html" "$project/styles.css" "_site/$project/"
            cp "$project"/js/*.js "_site/$project/js/"
            # Not every project ships pre-baked data (e.g. okr-map). Guard with an
            # if-block: a bare `[ -d ] && cp` returns 1 when absent, which is fatal
            # under `set -e` (bash -e) on the runner.
            if [ -d "$project/data" ]; then
              cp -r "$project/data" "_site/$project/data"
            fi
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
