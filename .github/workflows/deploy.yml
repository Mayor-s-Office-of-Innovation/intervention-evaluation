# Deploy the hypothesis tool to GitHub Pages.
# The app is fully static (CDN libs, live Socrata API, no build step) — we just
# stage the files the browser needs and upload them.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress production runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          # Root landing page
          mkdir -p _site/js
          cp index.html styles.css _site/
          cp js/*.js _site/js/
          # Each dashboard lives in its own subdir with an identical static layout:
          #   index.html + styles.css + js/*.js + pre-baked data/ JSON (build/ is
          #   offline Python and is intentionally not shipped). Add a project here
          #   when it gains an index.html.
          for project in districts theft unhoused drug; do
            if [ ! -f "$project/index.html" ]; then
              echo "Skipping $project (no index.html yet)"
              continue
            fi
            echo "Staging $project"
            mkdir -p "_site/$project/js"
            cp "$project/index.html" "$project/styles.css" "_site/$project/"
            cp "$project"/js/*.js "_site/$project/js/"
            [ -d "$project/data" ] && cp -r "$project/data" "_site/$project/data"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
