# Deploy the hypothesis tool to GitHub Pages.
# The app is fully static (CDN libs, live Socrata API, no build step) — we just
# stage the files the browser needs and upload them.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress production runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          mkdir -p _site/js
          cp index.html styles.css _site/
          cp js/*.js _site/js/
          # District encampment dashboard at /districts/ (static frontend + pre-baked data JSON)
          mkdir -p _site/districts/js
          cp districts/index.html districts/styles.css _site/districts/
          cp districts/js/*.js _site/districts/js/
          cp -r districts/data _site/districts/data
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
