# Deploy the hypothesis tool to GitHub Pages.
# The app is fully static (CDN libs, live Socrata API, no build step) — we just
# stage the files the browser needs and upload them.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress production runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          # Root landing page — static index of the dashboards, no JS of its own.
          mkdir -p _site
          cp index.html styles.css _site/
          # Each project lives in its own subdir with an identical static layout:
          #   index.html + styles.css + js/*.js + pre-baked data/ JSON (build/ is
          #   offline Python and is intentionally not shipped). Add a project here
          #   when it gains an index.html. `hypothesis` is the self-serve tool that
          #   used to live at the repo root.
          for project in districts theft unhoused drug okr-map hypothesis; do
            if [ ! -f "$project/index.html" ]; then
              echo "Skipping $project (no index.html yet)"
              continue
            fi
            echo "Staging $project"
            mkdir -p "_site/$project/js"
            cp "$project/index.html" "$project/styles.css" "_site/$project/"
            cp "$project"/js/*.js "_site/$project/js/"
            # Not every project ships pre-baked data (e.g. okr-map). Guard with an
            # if-block: a bare `[ -d ] && cp` returns 1 when absent, which is fatal
            # under `set -e` (bash -e) on the runner.
            if [ -d "$project/data" ]; then
              cp -r "$project/data" "_site/$project/data"
            fi
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
