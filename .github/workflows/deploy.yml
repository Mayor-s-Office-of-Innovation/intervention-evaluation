# Deploy the hypothesis tool to GitHub Pages.
# The app is fully static (CDN libs, live Socrata API, no build step) — we just
# stage the files the browser needs and upload them.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress production runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # V8 · gate the deploy on the build invariants, the classifier parity check, and the e2e suites.
  # (The source↔data trace is network/flaky, so it runs nightly in trace.yml, not here.)
  test:
    runs-on: ubuntu-latest
    # Run inside Playwright's official image (Chromium + all its system libs pre-installed) so CI never
    # touches apt / the flaky azure.archive.ubuntu.com mirror that was hanging `--with-deps`. Pin the
    # tag to the @playwright/test version in package-lock.json (1.60.0) so the image's pre-baked
    # browsers match the installed client; bump both together when upgrading Playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      # Browsers are baked into the image, so this is a no-op when versions match — kept (without
      # --with-deps) as a cheap self-heal if the client ever drifts ahead of the image tag. No apt.
      - run: npx playwright install chromium
      - name: V1+V3 · build invariants + axis alignment
        run: python3 validation/validate_build.py
      - name: V2 · classifier parity (drug + unhoused)
        run: |
          node validation/parity.mjs drug
          node validation/parity.mjs unhoused
      - name: e2e suites (V5 + V7 included)
        # One root playwright.config.js with a project per dashboard (plan-test-harness-consolidation.md).
        # Baked suites only here — hypothesis hits the live Socrata API, a poor deploy gate, so it stays out.
        run: npx playwright test --project=homepage --project=drug --project=unhoused --project=theft

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Stage site files
        run: |
          # Root landing page — the intervention tracker. It ships its own ES modules (js/app.js +
          # js/tsv.js) and fetches ./data/interventions.tsv, so stage the root js/ and data/ dirs too
          # (not just index.html/styles.css) or the homepage 404s on its script + data.
          mkdir -p _site
          cp index.html styles.css _site/
          mkdir -p _site/js && cp js/*.js _site/js/
          if [ -d data ]; then
            mkdir -p _site/data
            cp -r data/. _site/data/
          fi
          # Shared ES-module lib imported by the dashboards as ../../shared/*.js (data/rollup/
          # classify/chart/transition-map). Staged once at the site root so _site/<project>/js/app.js
          # resolves ../../shared/ to _site/shared/.
          if [ -d shared ]; then
            mkdir -p _site/shared
            cp shared/*.js _site/shared/
            # Shared CSS (e.g. map-search.css — the cross-street search box styling, centralized
            # here and linked by the dashboards + hypothesis tool as ../../shared/map-search.css).
            cp shared/*.css _site/shared/ 2>/dev/null || true
            # Baked shared data (e.g. the authoritative SF cross-street index the map search
            # lazy-loads via ./data/sf-intersections.json relative to shared/transition-map.js).
            if [ -d shared/data ]; then
              mkdir -p _site/shared/data
              cp -r shared/data/. _site/shared/data/
            fi
          fi
          # Each project lives in its own subdir with an identical static layout:
          #   index.html + styles.css + js/*.js + pre-baked data/ JSON (build/ is
          #   offline Python and is intentionally not shipped). Add a project here
          #   when it gains an index.html. `hypothesis` is the self-serve tool that
          #   used to live at the repo root.
          for project in theft unhoused drug okr-map hypothesis; do
            if [ ! -f "$project/index.html" ]; then
              echo "Skipping $project (no index.html yet)"
              continue
            fi
            echo "Staging $project"
            mkdir -p "_site/$project/js"
            cp "$project/index.html" "$project/styles.css" "_site/$project/"
            cp "$project"/js/*.js "_site/$project/js/"
            # Not every project ships pre-baked data (e.g. okr-map). Guard with an
            # if-block: a bare `[ -d ] && cp` returns 1 when absent, which is fatal
            # under `set -e` (bash -e) on the runner.
            if [ -d "$project/data" ]; then
              cp -r "$project/data" "_site/$project/data"
            fi
          done
      # Catch staging gaps before they 404 in prod (the landing page's js/ + data/ were once omitted).
      # The e2e gate runs against the repo root, so it can't see what the staging step forgot to copy —
      # this verifies the homepage's referenced assets actually made it into the uploaded artifact.
      - name: Verify homepage assets were staged
        run: |
          missing=0
          for f in index.html styles.css js/app.js js/tsv.js data/interventions.tsv; do
            if [ ! -f "_site/$f" ]; then echo "::error::homepage asset missing from _site: $f"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Staging is incomplete — see errors above."; exit 1; }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
