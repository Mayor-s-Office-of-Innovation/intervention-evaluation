# Saved-interventions API — Cloudflare Worker + KV (../docs/plan-saved-interventions.md).
# Run locally:   cd interventions-api && npx wrangler dev      (local KV — no account needed)
# Deploy:        npx wrangler deploy                            (after creating the KV namespace below)
name = "interventions-api"
main = "src/index.js"
compatibility_date = "2026-06-01"

# KV namespace. Create it once, then paste the printed id here:
#   npx wrangler kv namespace create INTERVENTIONS
# (The placeholder id is fine for `wrangler dev`, which uses a simulated local KV; a REAL id is only
#  needed for `wrangler deploy`.)
[[kv_namespaces]]
binding = "INTERVENTIONS"
id = "f5d4e1a36d594b448e2179f85c32f8d2"

# R2 bucket for intervention photos (../docs/plan-photo-uploads.md).
# This (public) Worker only READS/serves bytes; the separate Access-gated upload Worker writes them.
# `wrangler dev` simulates R2 locally — no account needed for local work.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "intervention-storage"

[vars]
# Comma-separated origins allowed for CORS AND that a saved URL must come from (the main spam defense).
ALLOWED_ORIGINS = "https://mayor-s-office-of-innovation.github.io,http://localhost:8090,http://127.0.0.1:8090"
# A saved URL must point at the hypothesis tool.
REQUIRED_PATH = "/hypothesis/"
# Email domain that flags a save as a "city" email — RECORDED, NOT ENFORCED yet (crack down later).
CITY_EMAIL_DOMAIN = "sfgov.org"
